<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>年上・信</title>
<style>
  :root {
    --bg: #241D2B;
    --bg-deep: #150F1A;
    --header: #2E2136;
    --header-light: #3D2C46;
    --accent: #C9A15F;
    --accent-soft: #E0C48A;
    --ink: #EAE2E6;
    --muted: #9C8FA3;
    --bubble: #322638;
    --bubble-narrative: #2B2131;
    --line: rgba(233,222,232,0.1);
    --good: #8FAE86;
    --bad: #D98080;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  #stage {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  .phone {
    width: 100%;
    max-width: 460px;
    height: min(880px, 96vh);
    background: var(--bg);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    position: relative;
    border: 1px solid rgba(255,255,255,0.06);
  }

  /* ---------- 通用头部 ---------- */
  .topbar {
    background: var(--header);
    color: #EFE9DC;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .topbar .back {
    background: none; border: none; color: #EFE9DC;
    font-size: 18px; cursor: pointer; padding: 4px 6px;
  }
  .topbar .title { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; flex: 1; }
  .topbar .sub { font-size: 11px; color: #B9C2BE; margin-top: 2px; }

  .scroll { flex: 1; overflow-y: auto; }
  .scroll::-webkit-scrollbar { width: 5px; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  /* ---------- 首页/通讯录 ---------- */
  .player-card {
    margin: 14px 16px 6px 16px;
    background: linear-gradient(135deg, var(--header), var(--header-light));
    border-radius: 16px;
    padding: 16px 18px;
    color: #F3EEE2;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
  }
  .avatar {
    width: 50px; height: 50px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }
  .player-card .info { flex: 1; }
  .player-card .name { font-size: 15.5px; font-weight: 700; }
  .player-card .meta { font-size: 11.5px; color: #C7CFC9; margin-top: 3px; }
  .player-card .edit-hint { font-size: 11px; color: var(--accent-soft); }

  .section-label {
    margin: 18px 16px 8px 16px;
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .char-card {
    margin: 0 16px 10px 16px;
    background: var(--bubble);
    border-radius: 14px;
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    border: 1px solid var(--line);
    position: relative;
  }
  .char-card .info { flex: 1; min-width: 0; }
  .char-card .name-row { display: flex; align-items: center; gap: 6px; }
  .char-card .name { font-size: 14.5px; font-weight: 700; }
  .char-card .flag { font-size: 11px; }
  .char-card .meta {
    font-size: 11.5px; color: var(--muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .char-card .trust-line {
    margin-top: 7px; height: 4px; border-radius: 3px;
    background: rgba(255,255,255,0.08); overflow: hidden;
  }
  .char-card .trust-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent-soft), var(--accent));
  }
  .char-card .stage-tag {
    font-size: 10px; color: var(--accent); margin-top: 4px; letter-spacing: 0.5px;
  }
  .char-card .del-btn {
    background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 6px;
  }

  .add-btn {
    margin: 6px 16px 18px 16px;
    background: var(--bubble);
    border: 1.5px dashed var(--muted);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    cursor: pointer;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); }

  .empty-hint {
    margin: 30px 24px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8;
  }

  /* ---------- 表单 ---------- */
  .form-wrap { padding: 16px; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.5px;
  }
  .field input[type=text], .field input[type=number], .field textarea, .field select {
    width: 100%; border: 1px solid var(--line); background: var(--bubble);
    border-radius: 10px; padding: 11px 12px; font-size: 14px; font-family: inherit; color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 64px; line-height: 1.6; }
  .field .row2 { display: flex; gap: 10px; }
  .field .row2 > div { flex: 1; }

  .tag-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-dropdown {
    border: 1px solid var(--line); border-radius: 10px; background: var(--bubble); overflow: hidden;
  }
  .tag-dropdown summary {
    list-style: none; cursor: pointer; padding: 11px 14px; font-size: 13.5px; color: var(--ink);
    display: flex; align-items: center; justify-content: space-between;
  }
  .tag-dropdown summary::-webkit-details-marker { display: none; }
  .tag-dropdown summary::after { content: "▾"; color: var(--muted); font-size: 11px; margin-left: 8px; }
  .tag-dropdown[open] summary { border-bottom: 1px solid var(--line); }
  .tag-dropdown[open] summary::after { content: "▴"; }
  .tag-dropdown .tag-wrap { padding: 10px 14px; }
  .tag-dropdown > div:not(.tag-wrap) { padding: 0 14px; }
  .tag-chip {
    padding: 7px 13px; border-radius: 20px; font-size: 12.5px;
    border: 1px solid var(--line); background: var(--bubble); cursor: pointer; color: var(--ink);
  }
  .tag-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .switch { position: relative; width: 42px; height: 24px; }
  .switch input { display:none; }
  .switch .track {
    position: absolute; inset: 0; background: #d5cdbd; border-radius: 20px; transition: 0.2s; cursor: pointer;
  }
  .switch .track::after {
    content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; top: 3px; left: 3px; transition: 0.2s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { left: 21px; }

  .slider-wrap { padding-top: 4px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .slider-labels { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 2px; }

  .primary-btn {
    width: 100%; background: var(--accent); color: #fff; border: none;
    padding: 14px; border-radius: 12px; font-size: 14.5px; font-weight: 700; cursor: pointer; letter-spacing: 0.5px;
  }
  .primary-btn:hover { background: #c9683f; }
  .primary-btn:disabled { opacity: 0.5; cursor: default; }

  .ghost-btn {
    width: 100%; background: none; color: var(--muted); border: 1px solid var(--line);
    padding: 12px; border-radius: 12px; font-size: 13.5px; cursor: pointer; margin-top: 8px;
  }

  /* ---------- 剧情/聊天流 ---------- */
  .thread { padding: 16px 14px 12px 14px; display: flex; flex-direction: column; gap: 12px; }

  .msg-row { display: flex; align-items: flex-start; gap: 6px; max-width: 100%; }
  .msg-row.user-row { justify-content: flex-end; }
  .edit-btn {
    background: none; border: none; color: var(--muted); font-size: 11px; cursor: pointer;
    padding: 4px; opacity: 0.5; flex-shrink: 0; margin-top: 4px;
  }
  .edit-btn:hover { opacity: 1; color: var(--accent); }
  .msg-row.editing { flex-direction: column; width: 100%; }
  .edit-textarea {
    width: 100%; min-height: 90px; border: 1px solid var(--accent); border-radius: 10px;
    padding: 10px; font-family: inherit; font-size: 13.5px; line-height: 1.6; color: var(--ink);
    background: var(--bubble);
  }
  .edit-btn-row { display: flex; gap: 8px; margin-top: 6px; }
  .edit-save-btn {
    background: var(--accent); color: #fff; border: none; padding: 6px 16px;
    border-radius: 8px; font-size: 12px; cursor: pointer;
  }
  .edit-cancel-btn {
    background: none; border: 1px solid var(--line); color: var(--muted); padding: 6px 16px;
    border-radius: 8px; font-size: 12px; cursor: pointer;
  }

  .stage-pill {
    align-self: center;
    font-size: 10.5px; color: var(--muted); background: rgba(255,255,255,0.06);
    padding: 4px 12px; border-radius: 12px; letter-spacing: 1px;
  }
  .system-pill {
    align-self: center; cursor: pointer;
    font-size: 11.5px; color: var(--accent-soft);
    background: rgba(201,161,95,0.12); border: 1px solid rgba(201,161,95,0.3);
    padding: 7px 14px; border-radius: 14px; margin: 4px 0;
  }
  .system-pill:hover { background: rgba(201,161,95,0.2); }

  .event-overlay {
    position: absolute; inset: 0; background: rgba(10,7,13,0.72);
    display: flex; align-items: center; justify-content: center; z-index: 20; padding: 24px;
  }
  .event-card {
    width: 100%; max-width: 360px; background: var(--header);
    border: 1px solid rgba(201,161,95,0.35); border-radius: 16px; padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .event-tag {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 1px;
    background: rgba(201,161,95,0.18); color: var(--accent-soft);
    padding: 4px 10px; border-radius: 8px; margin-bottom: 10px;
  }
  .event-title { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .event-desc { font-size: 13px; line-height: 1.7; color: var(--muted); margin-bottom: 16px; }
  .event-choice-btn {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    width: 100%; text-align: left; background: var(--bubble); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 14px; margin-bottom: 8px; cursor: pointer; font-family: inherit;
  }
  .event-choice-btn:hover { border-color: var(--accent); }
  .event-choice-btn .ec-label { font-size: 13.5px; color: var(--ink); font-weight: 700; }
  .event-choice-btn .ec-effect { font-size: 11.5px; color: var(--accent-soft); }

  /* ---------- 电话通话 ---------- */
  .call-screen {
    position: absolute; inset: 0; background: #0d0912; z-index: 30;
    display: flex; flex-direction: column; align-items: center; overflow: hidden;
  }
  .call-stars {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.7;
    background-image:
      radial-gradient(circle at 15% 18%, rgba(255,255,255,0.5) 0, transparent 1.5%),
      radial-gradient(circle at 78% 12%, rgba(255,255,255,0.4) 0, transparent 1.5%),
      radial-gradient(circle at 55% 30%, rgba(255,255,255,0.3) 0, transparent 1%),
      radial-gradient(circle at 25% 65%, rgba(255,255,255,0.35) 0, transparent 1.2%),
      radial-gradient(circle at 88% 75%, rgba(255,255,255,0.3) 0, transparent 1%),
      radial-gradient(circle at 40% 88%, rgba(255,255,255,0.25) 0, transparent 1%);
  }
  .call-top { margin-top: 46px; font-size: 12px; letter-spacing: 3px; color: var(--muted); z-index: 1; }
  .call-avatar-wrap { margin-top: 36px; z-index: 1; }
  .call-avatar-wrap.small { margin-top: 40px; }
  .call-avatar {
    width: 140px; height: 140px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 48px; font-weight: 700; color: #fff; box-shadow: 0 0 60px rgba(201,161,95,0.35);
  }
  .call-avatar-wrap.small .call-avatar { width: 88px; height: 88px; font-size: 30px; box-shadow: 0 0 40px rgba(201,161,95,0.3); }
  .call-name { margin-top: 20px; font-size: 22px; font-weight: 700; color: var(--ink); z-index: 1; }
  .call-preview {
    margin-top: 14px; font-size: 13.5px; color: var(--muted); text-align: center; max-width: 280px; z-index: 1; line-height: 1.7;
  }
  .call-actions { margin-top: auto; margin-bottom: 12px; display: flex; gap: 60px; z-index: 1; }
  .call-action-btn {
    width: 64px; height: 64px; border-radius: 50%; border: none; font-size: 22px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .call-action-btn.decline { background: #d9534f; color: #fff; transform: rotate(135deg); }
  .call-action-btn.accept { background: #5cb85c; color: #fff; }
  .call-action-labels { display: flex; gap: 46px; margin-bottom: 34px; font-size: 11px; color: var(--muted); z-index: 1; }

  .call-status { margin-top: 6px; font-size: 11px; color: var(--muted); letter-spacing: 2px; z-index: 1; }
  .call-timer { margin-top: 4px; font-size: 13px; color: var(--muted); z-index: 1; }
  .call-transcript {
    flex: 1; width: 100%; overflow-y: auto; padding: 16px 22px; display: flex; flex-direction: column; gap: 10px; z-index: 1;
  }
  .call-line-char { align-self: flex-start; max-width: 85%; font-size: 14px; line-height: 1.6; color: var(--ink); font-style: italic; }
  .call-line-player { align-self: flex-end; max-width: 85%; font-size: 13.5px; line-height: 1.6; color: var(--accent-soft); }
  .call-input-row { width: 100%; display: flex; gap: 8px; padding: 10px 16px; z-index: 1; box-sizing: border-box; }
  .call-input-row input {
    flex: 1; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05);
    border-radius: 20px; padding: 10px 15px; color: var(--ink); font-family: inherit; font-size: 13.5px;
  }
  .call-input-row button {
    width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--accent);
    color: #241D2B; font-size: 14px; cursor: pointer; flex-shrink: 0;
  }
  .call-hangup-btn {
    width: 56px; height: 56px; border-radius: 50%; border: none; background: #d9534f; color: #fff;
    font-size: 22px; margin: 14px 0 22px 0; transform: rotate(135deg); cursor: pointer; z-index: 1;
  }
  .call-minimize {
    position: absolute; top: 16px; left: 16px; background: none; border: none;
    color: var(--muted); font-size: 20px; cursor: pointer; z-index: 2;
  }

  .thought-card {
    align-self: flex-start; max-width: 92%; margin-top: -2px;
    border: 1px dashed rgba(201,161,95,0.4); border-radius: 10px; overflow: hidden;
    background: rgba(201,161,95,0.05);
  }
  .thought-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 12px; font-size: 11px; color: var(--accent-soft); cursor: pointer; letter-spacing: 0.5px;
  }
  .thought-body {
    padding: 0 12px 10px 12px; font-size: 12.5px; line-height: 1.7; color: var(--muted); font-style: italic;
  }

  .narration-block {
    font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    font-size: 14.5px;
    line-height: 2;
    color: var(--ink);
    padding: 2px 4px;
    max-width: 96%;
  }

  .dialogue-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .dialogue-tag {
    font-size: 10.5px; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; padding-left: 4px;
  }
  .bubble-dialogue {
    background: var(--bubble-narrative);
    border: 1px solid var(--line);
    border-radius: 4px 16px 16px 16px;
    padding: 12px 15px;
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--ink);
    max-width: 88%;
  }

  .bubble-user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-radius: 16px 4px 16px 16px;
    padding: 11px 15px;
    font-size: 14px;
    max-width: 78%;
    line-height: 1.6;
  }

  .typing {
    display: flex; gap: 5px; align-items: center; padding: 12px 16px;
    background: var(--bubble-narrative); border-radius: 4px 16px 16px 16px; width: fit-content;
    border: 1px solid var(--line);
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity: 0.25; } 40% { opacity: 1; } }

  .choices-panel {
    padding: 10px 14px 16px 14px;
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
    display: flex; flex-direction: column; gap: 8px;
    flex-shrink: 0;
  }
  .choice-btn {
    text-align: left; background: var(--bubble); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 13px; cursor: pointer; font-family: inherit;
  }
  .choice-btn:hover { border-color: var(--accent); }
  .choice-btn .ctext { font-size: 13.8px; color: var(--ink); display: block; }
  .choice-btn .csub { font-size: 11px; color: var(--muted); margin-top: 4px; display: block; font-style: italic; }

  .custom-input-row { display: flex; gap: 8px; margin-top: 2px; }
  .custom-input-row input {
    flex: 1; border: 1px solid var(--line); background: var(--bubble);
    border-radius: 20px; padding: 10px 15px; font-size: 13.5px; font-family: inherit; color: var(--ink);
  }
  .custom-input-row button {
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; flex-shrink: 0;
  }
  .custom-input-row button:hover { background: #c9683f; }

  .error-box {
    margin: 14px; padding: 14px; background: rgba(217,128,128,0.12); border: 1px solid rgba(217,128,128,0.35);
    border-radius: 12px; font-size: 13px; color: var(--bad);
  }
  .error-box button {
    margin-top: 10px; background: var(--accent); color: #fff; border: none;
    padding: 8px 16px; border-radius: 8px; font-size: 12.5px; cursor: pointer;
  }

  .hidden { display: none !important; }

  .bottom-tabs {
    display: flex; flex-shrink: 0; border-top: 1px solid var(--line);
    background: var(--header); padding: 8px 0 10px 0;
  }
  .bottom-tab {
    flex: 1; background: none; border: none; color: var(--muted);
    font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
    font-family: inherit;
  }
  .bottom-tab .bt-icon { font-size: 17px; }
  .bottom-tab.active { color: var(--accent-soft); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="stage"><div class="phone" id="phone"></div></div>

<script>
// ---------------- 存储适配：在 Claude 网页里用它自带的 window.storage，在普通浏览器（如 GitHub Pages）里退回 localStorage ----------------
const IN_CLAUDE_ARTIFACT = !!(window.storage && typeof window.storage.get === "function");
if (!IN_CLAUDE_ARTIFACT) {
  // 同一个 github.io 域名下的其它页面共用 localStorage，所以加前缀隔开
  const LS_PREFIX = "nianshang-xin:";
  window.storage = {
    async get(key){
      let value = null;
      try { value = localStorage.getItem(LS_PREFIX + key); } catch(e){ console.warn("读取本地存档失败", e); }
      return value === null ? null : { key, value };
    },
    async set(key, value){
      try { localStorage.setItem(LS_PREFIX + key, value); }
      catch(e){ throw new Error("保存到浏览器失败（可能是存储空间满了或被浏览器禁用）：" + e.message); }
      return { key, value };
    },
    async delete(key){
      try { localStorage.removeItem(LS_PREFIX + key); } catch(e){ console.warn("删除本地存档失败", e); }
      return { key, deleted: true };
    }
  };
}

const TAGS =["冷淡","毒舌","占有欲强","温柔","幽默风趣","强势","傲娇","理性克制","浪漫","少言寡语","宠溺","高冷学霸"];

const STAGES = [
  { key:"meet",        label:"初遇",       min:0,   goal:"初次搭话，建立基础印象，双方还带着礼貌和试探，尚不熟悉" },
  { key:"chat",         label:"日常闲聊",   min:12,  goal:"轻松日常闲聊，逐渐展露对方的背景、习惯与喜好" },

function getStage(trust){
  let cur = STAGES[0];
  for (const s of STAGES) { if (trust >= s.min) cur = s; }
  return cur;
}

function hashHue(str){
  let h = 0;
  for (let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) % 360; }
  return h;
}

function calcAge(birthDateStr){
  if (!birthDateStr) return null;
  const b = new Date(birthDateStr);
  if (isNaN(b.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
  return age;
}

function yearsAgoISO(years){
  const d = new Date();
  d.setFullYear(d.getFullYear() - years);
  return d.toISOString().slice(0,10);
}

function todayContextText(){
  return new Date().toLocaleDateString("zh-CN", { year:"numeric", month:"long", day:"numeric", weekday:"long" });
}

    const eligible = this.roster.filter(c => {
      if (!c.lastVisitedAt || c.pendingMessage) return false;
      const hours = (now - new Date(c.lastVisitedAt).getTime()) / 3600000;
      return hours >= 3;
    });
    if (!eligible.length) return;
    const pick = eligible[Math.floor(Math.random() * eligible.length)];
    if (Math.random() < 0.6) {
      await this.generateProactiveMessage(pick);
    }

    this.tempTags = [];
    this.screen = "charEdit";
    this.render();
  },

  openEditChar(id){
    const c = this.roster.find(x=>x.id===id);
    this.editingCharId = id;
    this.tempTags = c ? [...c.tags] : [];
    this.screen = "charEdit";
    this.render();
  },

  deleteChar(id, ev){
    ev.stopPropagation();
    if (!confirm("确定删除这个年上吗？聊天记录和好感度都会消失。")) return;
    this.roster = this.roster.filter(c=>c.id!==id);
    this.saveRoster();
    this.render();
  },

  async togglePin(id, ev){
    ev.stopPropagation();
    const char = this.roster.find(c => c.id === id);
    if (!char) return;
    char.pinned = !char.pinned;
    await this.saveRoster();
    this.render();
  },

  async loadConversation(charId){
    try {
      const r = await window.storage.get("convo:" + charId, false);
      return JSON.parse(r.value);
    } catch(e) { return null; }
  },

  async saveConversation(charId){
    const data = { thread: this.thread, choices: this.currentChoices, pendingMemory: this._pendingMemory || "", eventPopup: this.pendingEventPopup || null };
    try { await window.storage.set("convo:" + charId, JSON.stringify(data), false); } catch(e){ console.error(e); }
  },

  async resetConversation(){
    const charId = this.activeCharId;
    this.thread = [];
    this.currentChoices = null;
    this._pendingMemory = "";
    this.fetchError = false;
    this.pendingEventPopup = null;
    try { await window.storage.delete("convo:" + charId, false); } catch(e){}
    this.waitingReply = true;
    this.render();
    await this.fetchNextScene();
  },

  async openStory(id){
    this.activeCharId = id;
    this.fetchError = false;
    this.pendingEventPopup = null;
    const char = this.roster.find(c => c.id === id);
    const hadPendingMsg = !!(char && char.pendingMessage);
    let injectedMsg = null;
    if (char) {
      if (hadPendingMsg) { injectedMsg = char.pendingMessage; char.pendingMessage = null; }
      char.lastVisitedAt = new Date().toISOString();
      await this.saveRoster();
    }

    const saved = await this.loadConversation(id);
    if (saved && saved.thread && saved.thread.length) {
      this.thread = saved.thread;
      this.currentChoices = saved.choices || null;
      this._pendingMemory = saved.pendingMemory || "";
      this.pendingEventPopup = saved.eventPopup || null;
      this.waitingReply = false;
      this.screen = "story";
      this.render();
      if (injectedMsg) {
        this.thread.push({ type: "dialogue", text: injectedMsg.text, stageLabel: getStage(char.trust).label });
        this.currentChoices = null;
        this._skipNextDelta = true;
        this.waitingReply = true;
        this.render();
        await this.saveConversation(id);
        await this.fetchNextScene();
      } else if (!this.currentChoices) {
        this.waitingReply = true;
        await this.fetchNextScene();
      }
    } else {
      this.thread = [];
      this.currentChoices = null;
      this.waitingReply = true;
      this.screen = "story";
      if (injectedMsg) {
        this.thread.push({ type: "dialogue", text: injectedMsg.text, stageLabel: getStage(char.trust).label });
        this._skipNextDelta = true;
      }
      this.render();
      await this.fetchNextScene();
    }
  },

  // ---------------- 电话通话 ----------------
  startCall(charId){
    this.activeCharId = charId;
    this.callThread = [];
    this.callPreviewLine = "";
    this.callSeconds = 0;
    this.callState = "incoming";
    this.screen = "call";
    this.render();
    this.fetchCallPreview();
    this.ringTimeout = setTimeout(() => {
      if (this.callState === "incoming") this.declineCall();
    }, 20000);
  },

  async fetchCallPreview(){
    const char = this.roster.find(c => c.id === this.activeCharId);
    if (!char) return;
    try {
      const prompt = `你在扮演角色给玩家打电话，这是电话接通前的一句"预览文案"（类似来电铃声响起时手机上显示的一句话）。
角色人设：${this.charSummaryForFeed(char)}
请写一句符合这个角色性格和说话方式的来电预览文案（10-20字，口语化，可以带点情绪或悬念）。
请只输出如下格式的JSON（不要有其它任何文字）：
{"line":"..."}`;
      let raw = await this.callAI(prompt);
      raw = raw.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(raw);
      this.callPreviewLine = parsed.line || "接电话。";
    } catch(e) {
      this.callPreviewLine = "接电话。";
    }
    if (this.callState === "incoming") this.render();
  },

  declineCall(){
    clearTimeout(this.ringTimeout);
    this.callState = null;
    this.screen = "story";
    this.render();
  },

  acceptCall(){
    clearTimeout(this.ringTimeout);
    this.callThread.push({ speaker: "char", text: this.callPreviewLine || "喂？" });
    this.callState = "active";
    this.callSeconds = 0;
    this.render();
    this.startCallTimer();
  },

  startCallTimer(){
    this.stopCallTimer();
    this._callTimerId = setInterval(() => {
      this.callSeconds++;
      const el = document.getElementById("callTimerDisplay");
      if (el) {
        const m = Math.floor(this.callSeconds / 60);
        const s = this.callSeconds % 60;
        el.textContent = (m<10?"0":"")+m + ":" + (s<10?"0":"")+s;
      }
    }, 1000);
  },

  stopCallTimer(){
    if (this._callTimerId) { clearInterval(this._callTimerId); this._callTimerId = null; }
  },

  hangupCall(){
    this.stopCallTimer();
    this.callState = null;
    this.screen = "story";
    this.render();
  },

  async sendCallLine(text){
    const trimmed = (text || "").trim();
    if (!trimmed || this.callBusy) return;
    const char = this.roster.find(c => c.id === this.activeCharId);
    if (!char) return;
    this.callThread.push({ speaker: "player", text: trimmed });
    this.render();
    this.callBusy = true;
    this.render();
    try {
      const stage = getStage(char.trust);
      const transcript = this.callThread.map(t => (t.speaker === "char" ? char.name : (this.profile ? this.profile.name : "你")) + "：" + t.text).join("\n");
      const prompt = `你在扮演角色接玩家的电话，这是一通正在进行的电话，只有声音，没有画面。
角色人设：${this.charSummaryForFeed(char)}
当前关系阶段：${stage.label}
通话记录（按顺序）：
${transcript}

请写角色接下来说的一句话（口语化、符合性格与说话方式，20-50字，如果是外语角色按语言混搭比例适当混英文），并评估玩家刚才那句话对关系的影响，给出trustDelta（-3到6之间的整数）。如果这句话里有值得记住的具体事情，写入memoryNote（不超过20字），否则留空。
请只输出如下格式的JSON（不要有其它任何文字）：
{"line":"...","trustDelta":0,"memoryNote":""}`;
      let raw = await this.callAI(prompt);
      raw = raw.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(raw);
      char.trust = Math.max(0, char.trust + (parseInt(parsed.trustDelta) || 0));
      if (parsed.memoryNote) {
        char.memory = char.memory || [];
        char.memory.push(parsed.memoryNote);
        if (char.memory.length > 8) char.memory.shift();
      }
      this.callThread.push({ speaker: "char", text: parsed.line || "……" });
      await this.saveRoster();
    } catch(e) {
      console.error(e);
      this.callThread.push({ speaker: "char", text: "（信号好像不太好……）" });
    }
    this.callBusy = false;
    this.render();
  },

  // ---------------- AI 调用 ----------------
  getRecentHistoryText(){
    const recent = this.thread.slice(-10);
    if (!recent.length) return "（这是你们的第一次见面，还没有过往对话，请自行设定一个合理的初遇场景）";
    return recent.map(m => {
      if (m.type === "user") return "【你】" + m.text;
      if (m.type === "dialogue") return "【对方】" + m.text;
      return "【旁白】" + m.text;
    }).join("\n");
  },

  buildRoleAssignmentText(char){
    if (!char.relTags || !char.relRoles) return "";
    const lines = [];
    char.relTags.forEach(t => {
      if (POWER_PAIR_TAGS[t] && char.relRoles[t] !== undefined) {
        const pair = POWER_PAIR_TAGS[t];
        const line = char.relRoles[t]
          ? `在"${t}"这段关系里，对方是${pair[0]}，玩家是${pair[1]}。`
          : `在"${t}"这段关系里，玩家是${pair[0]}，对方是${pair[1]}。`;
        lines.push(line);
      }
    });
    return lines.join("");
  },

  buildPrompt(char, includeOpening){
    const p = this.profile;
    const stage = getStage(char.trust);
    const memoryText = (char.memory && char.memory.length) ? char.memory.join("；") : "（暂无特别记忆）";
    const recentHistory = this.getRecentHistoryText();
    const langInstruction = char.isForeign
      ? `这个角色是外国人设（语言背景：${char.langBg || "外国人"}），中英混搭程度为 ${char.mixRatio}%（0%表示几乎全中文只偶尔蹦单词，100%表示大量使用英文短句和倒装语序，中间值请按比例适度混合英文单词或短句到台词与叙述中）。`
      : "这个角色使用纯中文对话，不需要任何英文。";

    return `你是一个恋爱剧情写作引擎，正在为一个"年上模拟器"文字游戏生成剧情。请严格按要求输出，不要输出任何JSON以外的文字、不要用markdown代码块包裹。

【玩家人设】
姓名：${p.name}　性别：${p.gender}　年龄：${calcAge(p.birthDate)}岁　职业：${p.occupation}
外表风格：${p.appearance}
性格标签：${p.tags.join("、")}
性格补充：${p.personalityText || "无"}
说话方式：${p.speechStyle || "无特别习惯"}

【年上角色人设】
姓名：${char.name}　性别：${char.gender}　年龄：${calcAge(char.birthDate)}岁（比玩家年长）　职业：${char.occupation}
外表风格：${char.appearance}
性格标签：${char.tags.join("、")}
关系原型（决定关系基调与张力来源，请重点体现）：${(char.relTags && char.relTags.length) ? char.relTags.join("、") : "无特别设定"}
${this.buildRoleAssignmentText(char)}
性格补充：${char.personalityText || "无"}
说话方式：${char.speechStyle || "无特别习惯"}
${langInstruction}

【当前关系阶段】${stage.label}
本阶段剧情目标：${stage.goal}
当前好感度数值：${char.trust}
过去的关键记忆：${memoryText}
【现实中的今天】${todayContextText()}（如果剧情里提到日期、星期、季节，请以此为准）

【最近剧情回顾（请紧密承接这里的场景、时间、地点、人物状态，不要凭空跳到不相关的新场景或新地点）】
${recentHistory}

【写作要求】
1. 用小说笔法写这段剧情，但不要把叙事和对话糅在一整段里，而是拆分成多个"片段"（segments），每个片段标明类型：
   - "narration"：环境、动作、心理描写（第二人称"你"视角），不包含对方的直接引语
   - "dialogue"：对方说出的一句话本身，纯粹是台词内容，不要加「」引号、不要加"他说""她说"这类提示语，也不要包含旁白
   一段完整剧情通常是 narration → dialogue → narration → dialogue 这样交替，2-5个片段，总字数150-300字。
2. 对话内容要符合角色的性格标签、说话方式与语言混搭要求。
3. ${includeOpening
      ? (char.seed ? `这是你们这次见面的开场，玩家为你们的相识写了这样的设定，请以此为背景自然展开，不要另编：${char.seed}` : "这是你们这次见面的开场，请自然地设定一个合理的初遇/相处场景展开。")
      : "请严格承接上面【最近剧情回顾】里的场景状态继续发展——如果上一刻还在电梯里，这一刻不能突然出现在家里，除非剧情里有明确的转场动作（比如一起走出电梯、一起离开办公室），否则要保持在同一个场景里推进。"}
4. 给出3个玩家可选的回应，每个回应拆成两部分：
   - "action"：玩家的动作/表情/心理活动描写（第二人称"你"视角，比如"你別过脸，没接话"），如果这个回应只是单纯说话没有特别动作，action留空字符串
   - "line"：玩家说出的话本身，纯对话内容，不要加引号，如果这个回应只是动作没有说话，line留空字符串
   - action和line不能同时为空，但可以只有其中一个
   - 另外附一句"subtext"潜台词（这句话/这个动作背后玩家的真实心思，10-16字）
5. 新增一个字段"lastActionTrustDelta"：根据【最近剧情回顾】里最后一条"【你】"的发言或行动，评价它对这段关系的影响，给出一个-4到12之间的整数。如果这是开场、还没有玩家的行动，这个字段填0。
6. 如果这段剧情里发生了值得记住的具体事情（比如透露了某个爱好、恐惧、习惯、约定），用不超过20字的一句话写入memoryNote；如果没有特别值得记的内容，memoryNote返回空字符串。
7. 额外判断：这一幕有没有可能被外人拍到、认出、偶遇、截图或以其他方式流出到网络上（比如被狗仔拍到、被路人认出合影、被粉丝偶遇、被朋友截图转发等）？如果有，用一句客观描述（不超过30字，只写外人会看到的画面/内容本身，不要写心理活动）写入publicIncident字段；如果没有这种可能性，publicIncident留空字符串。不要为了流出而流出——大多数日常场景都不会有，只有真正有戏剧性、暴露性、外人会感兴趣的时刻才触发（比如被拍到亲密瞬间、公众人物身份的角色被偶遇、绯闻线索等）。
8. 额外判断：这一幕是否适合变成一个需要玩家立刻做决定的"紧急弹窗事件"（比如私信被骚扰轰炸、网络暴力、身份曝光危机、绯闻发酵到失控、粉丝闹翻天等突发状况，不限于这些例子）。如果适合，写入eventPopup字段：{"tag":"简短标签，比如'危机来袭'","title":"标题","description":"1-2句情境描述","choices":[{"label":"选项按钮文字","effectText":"这个选择带来的效果反馈文字，风格随情境自定，比如'粉丝+3万 压力：低'或'他的疑心 加重了'","trustDelta":整数}]}（2-3个choices）；如果这一幕不需要弹窗事件，eventPopup填null。这个不需要每次都出现，只有真正紧急、需要玩家马上抉择的时刻才触发，大多数日常场景都不需要。
9. 额外判断：这一幕角色表面的言行和内心真实想法之间，有没有明显到值得一提的反差（比如嘴上刻薄心里却慌得要命、表面冷淡内心早已心动）？如果有，写一段第一人称的内心独白（innerThought字段），TA自己的口吻，语言可以粗粝、破碎、口语化，不用讲究文采，越真实越好，40-90字；如果这一幕没有这种明显反差、内心和言行基本一致，innerThought留空字符串。不需要每一幕都有，大概三五幕出现一次比较自然，出现得太频繁会失去惊喜感。

请只输出如下格式的JSON（不要有其它任何文字）：
{"segments":[{"type":"narration","text":"..."},{"type":"dialogue","text":"..."}],"choices":[{"action":"...","line":"...","subtext":"..."},{"action":"...","line":"...","subtext":"..."},{"action":"...","line":"...","subtext":"..."}],"lastActionTrustDelta":0,"memoryNote":"...","publicIncident":"","eventPopup":null,"innerThought":"..."}`;
  },

  async callClaude(promptText){
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: promptText }]
      })
    });
    const data = await response.json();
    const block = (data.content || []).find(b => b.type === "text");
    if (!block) throw new Error("空响应");
    return block.text;
  },

  // 网络层失败（断网、或服务商不允许网页直接调用）时 fetch 会直接抛 TypeError，换成看得懂的话
  async fetchAI(url, options){
    let response;
    try { response = await fetch(url, options); }
    catch(e) { throw friendlyError("连不上AI服务器（可能是网络问题，或这家服务商不允许网页直接调用）"); }
    if (!response.ok) {
      let detail = "";
      try { detail = (await response.text()).slice(0,120); } catch(e){}
      throw friendlyError(httpErrorMessage(response.status, detail));
    }
    return response.json();
  },

  async callExternal(promptText, settings){
    if (!settings.baseUrl) throw friendlyError("未填写接口地址");
    if (!settings.apiKey) throw friendlyError("未填写API Key");
    const data = await this.fetchAI(settings.baseUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + settings.apiKey
      },
      body: JSON.stringify({
        model: settings.model,
        messages: [{ role: "user", content: promptText }],
        max_tokens: 1000
      })
    });
    const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!content) throw new Error("响应格式不符合预期（未取到choices[0].message.content）");
    return content;
  },

  // 用自己的 Anthropic key 从浏览器直连（需要 anthropic-dangerous-direct-browser-access 头才允许跨域）
  async callAnthropic(promptText, settings){
    if (!settings.apiKey) throw friendlyError("未填写API Key");
    const model = settings.model || PROVIDER_PRESETS.anthropic.model;
    const headers = {
      "Content-Type": "application/json",
      "x-api-key": settings.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    };
    // 这几款模型被安全审查拒绝时，可以让服务器自动换一个模型重试
    const body = { model, max_tokens: 16000, messages: [{ role: "user", content: promptText }] };
    if (/^claude-(opus-5|fable-5-1|sonnet-5-5)/.test(model)) {
      headers["anthropic-beta"] = "server-side-fallback-2026-07-01";
      body.fallbacks = "default";
    }
    const data = await this.fetchAI(settings.baseUrl || PROVIDER_PRESETS.anthropic.baseUrl, {
      method: "POST", headers, body: JSON.stringify(body)
    });
    if (data.stop_reason === "refusal") throw friendlyError("这一段AI拒绝生成，换个选项或点重试");
    // 发生过自动换模型时，只取最后一次换模型之后的文字
    const blocks = data.content || [];
    let start = 0;
    blocks.forEach((b, i) => { if (b.type === "fallback") start = i + 1; });
    const text = blocks.slice(start).filter(b => b.type === "text").map(b => b.text).join("");
    if (!text) throw new Error("空响应");
    return text;
  },

  aiReady(){
    if (IN_CLAUDE_ARTIFACT) return true;
    const s = this.aiSettings;
    return !!(s && s.provider !== "builtin" && s.apiKey);
  },

  async callAI(promptText){
    const s = this.aiSettings;
    if (!s || s.provider === "builtin" || !s.apiKey) {
      if (!IN_CLAUDE_ARTIFACT) throw friendlyError("还没设置AI：回到通讯录，点右上角 ⚙ 填上你的 API Key");
      return this.callClaude(promptText);
    }
    if (s.provider === "anthropic") return this.callAnthropic(promptText, s);
    return this.callExternal(promptText, s);
  },

  async fetchNextScene(){
    const char = this.roster.find(c=>c.id===this.activeCharId);
    if (!char) return;
    this.waitingReply = true;
    this.renderTypingOnly();
    try {
      const trueOpening = this.thread.length === 0;
      const skipDelta = trueOpening || this._skipNextDelta;
      if (this._skipNextDelta) this._skipNextDelta = false;
      const prompt = this.buildPrompt(char, trueOpening);
      let raw = await this.callAI(prompt);
      raw = raw.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(raw);
      const deltaApplied = skipDelta ? 0 : (parseInt(parsed.lastActionTrustDelta) || 0);
      if (!skipDelta) {
        char.trust = Math.max(0, char.trust + deltaApplied);
      }
      const stageLabelNow = getStage(char.trust).label;
      let segCount = 0;
      const segList = parsed.segments || [];
      segList.forEach((seg, i) => {
        const entry = { type: seg.type === "dialogue" ? "dialogue" : "narration", text: seg.text };
        if (i === 0) entry.stageLabel = stageLabelNow;
        if (i === segList.length - 1 && parsed.innerThought) {
          entry.innerThought = parsed.innerThought;
          entry.revealed = false;
        }
        this.thread.push(entry);
        segCount++;
      });
      this.lastSegmentCount = segCount;
      this.lastAppliedDelta = deltaApplied;
      this.currentChoices = (parsed.choices || []).map(c => ({
        action: c.action || "",
        line: c.line || "",
        subtext: c.subtext || ""
      }));
      this._pendingMemory = parsed.memoryNote || "";
      this.waitingReply = false;
      if (parsed.eventPopup && parsed.eventPopup.choices && parsed.eventPopup.choices.length) {
        this.pendingEventPopup = parsed.eventPopup;
        this.currentChoices = null;
      } else {
        this.pendingEventPopup = null;
      }
      if (parsed.publicIncident) {
        this.thread.push({ type: "system", text: "📰 这一幕被传到了网上", incidentText: parsed.publicIncident });
        this.lastSegmentCount += 1;
        this.triggerPublicIncident(char, parsed.publicIncident);
      }
      await this.saveRoster();
      await this.saveConversation(this.activeCharId);
      this.render();
    } catch(e){
      console.error(e);
      this.waitingReply = false;
      this.fetchError = true;
      this.fetchErrorMsg = e && e.friendly ? e.message : "";
      this.render();
    }
  },

  async pickChoice(idx){
    if (this.waitingReply) return;
    const char = this.roster.find(c=>c.id===this.activeCharId);
    const choice = this.currentChoices[idx];
    if (choice.action) this.thread.push({ type:"narration", text: choice.action });
    if (choice.line) this.thread.push({ type:"user", text: choice.line });
    if (this._pendingMemory) {
      char.memory = char.memory || [];
      char.memory.push(this._pendingMemory);
      if (char.memory.length > 8) char.memory.shift();
    }
    this.currentChoices = null;
    this.fetchError = false;
    await this.saveRoster();
    await this.saveConversation(this.activeCharId);
    this.render();
    await this.fetchNextScene();
  },

  async pickEventPopupChoice(idx){
    if (this.waitingReply || !this.pendingEventPopup) return;
    const char = this.roster.find(c=>c.id===this.activeCharId);
    const choice = this.pendingEventPopup.choices[idx];
    if (!choice) return;
    char.trust = Math.max(0, char.trust + (parseInt(choice.trustDelta) || 0));
    this.thread.push({ type: "system", text: "「" + choice.label + "」" + (choice.effectText ? "　" + choice.effectText : "") });
    if (this._pendingMemory) {
      char.memory = char.memory || [];
      char.memory.push(this._pendingMemory);
      if (char.memory.length > 8) char.memory.shift();
    }
    this.pendingEventPopup = null;
    this.currentChoices = null;
    this.fetchError = false;
    await this.saveRoster();
    await this.saveConversation(this.activeCharId);
    this.render();
    await this.fetchNextScene();
  },

  async sendCustomAction(text){
    if (this.waitingReply) return;
    const trimmed = (text || "").trim();
    if (!trimmed) return;
    const char = this.roster.find(c=>c.id===this.activeCharId);
    this.thread.push({ type:"user", text: trimmed });
    if (this._pendingMemory) {
      char.memory = char.memory || [];
      char.memory.push(this._pendingMemory);
      if (char.memory.length > 8) char.memory.shift();
    }
    this.currentChoices = null;
    this.fetchError = false;
    await this.saveRoster();
    await this.saveConversation(this.activeCharId);
    this.render();
    await this.fetchNextScene();
  },

  retryFetch(){
    this.fetchError = false;
    this.fetchNextScene();
  },

  async regenerateLast(){
    if (this.waitingReply) return;
    const char = this.roster.find(c=>c.id===this.activeCharId);
    if (!char) return;
    char.trust = Math.max(0, char.trust - (this.lastAppliedDelta || 0));
    const n = this.lastSegmentCount || 0;
    for (let i = 0; i < n; i++) this.thread.pop();
    this.currentChoices = null;
    this.fetchError = false;
    await this.saveRoster();
    await this.saveConversation(this.activeCharId);
    this.render();
    await this.fetchNextScene();
  },

  renderRelTagPicker(container, selected){
    container.innerHTML = "";
    if (!this.tempRelRoles) this.tempRelRoles = {};
    const chipEls = {};

    const details = document.createElement("details");
    details.className = "tag-dropdown";
    const summary = document.createElement("summary");
    const updateSummary = () => {
      summary.textContent = selected.length ? ("关系原型：" + selected.join("、")) : "选择关系原型标签（最多2个） ▾";
    };
    updateSummary();
    details.appendChild(summary);

    REL_TAG_GROUPS.forEach(g => {
      const groupLabel = document.createElement("div");
      groupLabel.style.cssText = "font-size:10.5px;color:var(--muted);margin:8px 0 4px 0;";
      groupLabel.textContent = g.group;
      details.appendChild(groupLabel);

      const wrap = document.createElement("div");
      wrap.className = "tag-wrap";
      wrap.style.marginBottom = "4px";
      g.tags.forEach(t => {
        const chip = document.createElement("div");
        chip.className = "tag-chip" + (selected.includes(t) ? " active" : "");
        chip.textContent = t;
        chipEls[t] = chip;
        chip.onclick = () => {
          const i = selected.indexOf(t);
          if (i >= 0) {
            selected.splice(i, 1);
            chip.classList.remove("active");
            delete this.tempRelRoles[t];
          } else {
            if (selected.length >= MAX_REL_TAGS) {
              const removed = selected.shift();
              if (chipEls[removed]) chipEls[removed].classList.remove("active");
              delete this.tempRelRoles[removed];
            }
            selected.push(t);
            chip.classList.add("active");
          }
          updateSummary();
          renderRoleBlock();
        };
        wrap.appendChild(chip);
      });
      details.appendChild(wrap);
    });
    container.appendChild(details);

    const roleBlock = document.createElement("div");
    roleBlock.style.marginTop = "8px";
    container.appendChild(roleBlock);

    const renderRoleBlock = () => {
      roleBlock.innerHTML = "";
      selected.filter(t => POWER_PAIR_TAGS[t]).forEach(t => {
        const pair = POWER_PAIR_TAGS[t];
        if (this.tempRelRoles[t] === undefined) this.tempRelRoles[t] = true;
        const row = document.createElement("div");
        row.style.cssText = "background:var(--bubble);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;font-size:12.5px;";
        const label = document.createElement("div");
        label.style.cssText = "color:var(--muted);margin-bottom:6px;";
        label.textContent = "「" + t + "」谁扮演哪个角色？";
        row.appendChild(label);
        const btnRow = document.createElement("div");
        btnRow.style.cssText = "display:flex;gap:8px;";
        const optA = document.createElement("div");
        optA.className = "tag-chip" + (this.tempRelRoles[t] ? " active" : "");
        optA.textContent = "TA是" + pair[0] + "，你是" + pair[1];
        optA.onclick = () => { this.tempRelRoles[t] = true; renderRoleBlock(); };
        const optB = document.createElement("div");
        optB.className = "tag-chip" + (!this.tempRelRoles[t] ? " active" : "");
        optB.textContent = "你是" + pair[0] + "，TA是" + pair[1];
        optB.onclick = () => { this.tempRelRoles[t] = false; renderRoleBlock(); };
        btnRow.appendChild(optA); btnRow.appendChild(optB);
        row.appendChild(btnRow);
        roleBlock.appendChild(row);
      });
    };
    renderRoleBlock();
  },

  exportNovel(char){
    const playerName = this.profile ? this.profile.name : "你";
    const lines = [];
    lines.push("# 与" + char.name + "的故事");
    lines.push("");
    lines.push("> 导出于 " + new Date().toLocaleString());
    lines.push("");
    this.thread.forEach(msg => {
      if (msg.type === "narration") {
        lines.push(msg.text);
      } else if (msg.type === "dialogue") {
        lines.push("**" + char.name + "**：" + msg.text);
      } else if (msg.type === "system") {
        lines.push("> " + msg.text);
      } else {
        lines.push("**" + playerName + "**：" + msg.text);
      }
      lines.push("");
    });
    const blob = new Blob([lines.join("\n")], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "与" + char.name + "的故事.md";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },

  formatFeedTime(iso){
    const d = new Date(iso);
    const now = new Date();
    const diffMs = now - d;
    const diffMin = Math.floor(diffMs / 60000);
    if (diffMin < 1) return "刚刚";
    if (diffMin < 60) return diffMin + "分钟前";
    const diffH = Math.floor(diffMin / 60);
    if (diffH < 24) return diffH + "小时前";
    const diffD = Math.floor(diffH / 24);
    if (diffD < 7) return diffD + "天前";
    return d.toLocaleDateString();
  },

        <button class="back" id="exportNovelBtn" title="导出成小说">⬇</button>
        <button class="back" id="memBtn" title="查看记忆">☰</button>
        <button class="back" id="resetBtn" title="重新开始这段对话">↺</button>
      </div>
      <div class="scroll" id="threadScroll"><div class="thread" id="threadInner"></div></div>
      <div class="choices-panel" id="choicesPanel"></div>
    `;
    root.querySelector("#backBtn").onclick = () => this.goHome();
    root.querySelector("#callBtn").onclick = () => this.startCall(char.id);
    root.querySelector("#memBtn").onclick = () => this.openMemoryReview(char.id, "story");
    root.querySelector("#exportNovelBtn").onclick = () => this.exportNovel(char);
    root.querySelector("#resetBtn").onclick = () => {
      if (confirm("确定要清空和" + char.name + "的对话记录，重新开始吗？（好感度和记忆不会重置）")) {
        this.resetConversation();
      }
    };

    const inner = root.querySelector("#threadInner");
    let lastStage = null;
    this.thread.forEach((msg, idx) => {
      if (msg.stageLabel && msg.stageLabel !== lastStage) {
        const pill = document.createElement("div");
        pill.className = "stage-pill";
        pill.textContent = msg.stageLabel;
        inner.appendChild(pill);
        lastStage = msg.stageLabel;
      }
      if (msg.type === "narration") {
        const row = document.createElement("div");
        row.className = "msg-row";
        const b = document.createElement("div");
        b.className = "narration-block";
        b.textContent = msg.text;
        const edit = document.createElement("button");
        edit.className = "edit-btn";
        edit.innerHTML = '✎';
        edit.onclick = () => this.startEditMsg(idx, row);
        row.appendChild(b); row.appendChild(edit);
        inner.appendChild(row);
      } else if (msg.type === "dialogue") {
        const wrap = document.createElement("div");
        wrap.className = "dialogue-wrap";
        const tag = document.createElement("div");
        tag.className = "dialogue-tag";
        tag.textContent = char.name;
        const row = document.createElement("div");
        row.className = "msg-row";
        const b = document.createElement("div");
        b.className = "bubble-dialogue";
        b.textContent = msg.text;
        const edit = document.createElement("button");
        edit.className = "edit-btn";
        edit.innerHTML = '✎';
        edit.onclick = () => this.startEditMsg(idx, row);
        row.appendChild(b); row.appendChild(edit);
        wrap.appendChild(tag); wrap.appendChild(row);
        inner.appendChild(wrap);
      } else if (msg.type === "system") {
        const pill = document.createElement("div");
        pill.className = "system-pill";
        pill.textContent = msg.text + "  去看看 →";
        pill.onclick = () => this.openFeed();
        inner.appendChild(pill);
      } else {
        const row = document.createElement("div");
        row.className = "msg-row user-row";
        const edit = document.createElement("button");
        edit.className = "edit-btn";
        edit.innerHTML = '✎';
        edit.onclick = () => this.startEditMsg(idx, row);
        const b = document.createElement("div");
        b.className = "bubble-user";
        b.textContent = msg.text;
        row.appendChild(edit); row.appendChild(b);
        inner.appendChild(row);
      }

      if (msg.innerThought) {
        const thoughtCard = document.createElement("div");
        thoughtCard.className = "thought-card";
        const header = document.createElement("div");
        header.className = "thought-header";
        header.innerHTML = "<span>" + (char.name) + " 的心理</span><span>" + (msg.revealed ? "▴" : "▾") + "</span>";
        header.onclick = () => {
          msg.revealed = !msg.revealed;
          this.render();
        };
        thoughtCard.appendChild(header);
        if (msg.revealed) {
          const body = document.createElement("div");
          body.className = "thought-body";
          body.textContent = msg.innerThought;
          thoughtCard.appendChild(body);
        }
        inner.appendChild(thoughtCard);
      }
    });

    if (this.waitingReply) {
      const t = document.createElement("div");
      t.className = "typing";
      t.innerHTML = "<span></span><span></span><span></span>";
      inner.appendChild(t);
    }

    const panel = root.querySelector("#choicesPanel");

    if (this.pendingEventPopup && !this.waitingReply) {
      const ep = this.pendingEventPopup;
      const overlay = document.createElement("div");
      overlay.className = "event-overlay";
      const card = document.createElement("div");
      card.className = "event-card";
      const tag = document.createElement("div");
      tag.className = "event-tag";
      tag.textContent = ep.tag || "事件";
      const title = document.createElement("div");
      title.className = "event-title";
      title.textContent = ep.title || "";
      const desc = document.createElement("div");
      desc.className = "event-desc";
      desc.textContent = ep.description || "";
      card.appendChild(tag); card.appendChild(title); card.appendChild(desc);
      (ep.choices || []).forEach((c, idx) => {
        const btn = document.createElement("button");
        btn.className = "event-choice-btn";
        const lbl = document.createElement("span");
        lbl.className = "ec-label";
        lbl.textContent = c.label;
        const eff = document.createElement("span");
        eff.className = "ec-effect";
        eff.textContent = c.effectText || "";
        btn.appendChild(lbl); btn.appendChild(eff);
        btn.onclick = () => this.pickEventPopupChoice(idx);
        card.appendChild(btn);
      });
      overlay.appendChild(card);
      root.appendChild(overlay);
    }

    if (this.fetchError) {
      const box = document.createElement("div");
      box.className = "error-box";
      box.style.margin = "0";
      const msg = document.createElement("div");
      msg.textContent = this.fetchErrorMsg ? "生成失败了：" + this.fetchErrorMsg : "生成失败了，可能是网络或接口的问题。";
      box.appendChild(msg);
      const btn = document.createElement("button");
      btn.textContent = "重试";
      btn.onclick = () => this.retryFetch();
      box.appendChild(btn);
      panel.appendChild(box);
    } else if (!this.waitingReply && this.currentChoices) {
      const regenRow = document.createElement("div");
      regenRow.style.display = "flex";
      regenRow.style.justifyContent = "flex-end";
      regenRow.style.marginBottom = "2px";
      const regenBtn = document.createElement("button");
      regenBtn.textContent = "↻ 换一种写法";
      regenBtn.style.cssText = "background:none;border:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:4px 6px;";
      regenBtn.onclick = () => this.regenerateLast();
      regenRow.appendChild(regenBtn);
      panel.appendChild(regenRow);

      this.currentChoices.forEach((c, idx) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        const ct = document.createElement("span"); ct.className="ctext";
        let label = "";
        if (c.action) label += c.action;
        if (c.action && c.line) label += "　";
        if (c.line) label += "「" + c.line + "」";
        ct.textContent = label;
        const cs = document.createElement("span"); cs.className="csub"; cs.textContent = "内心：" + c.subtext;
        btn.appendChild(ct); btn.appendChild(cs);
        btn.onclick = () => this.pickChoice(idx);
        panel.appendChild(btn);
      });

      const customRow = document.createElement("div");
      customRow.className = "custom-input-row";
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "或者，自己写你想说/想做的…";
      const sendBtn = document.createElement("button");
      sendBtn.innerHTML = '➤';
      const submit = () => { this.sendCustomAction(input.value); };
      sendBtn.onclick = submit;
      input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
      customRow.appendChild(input); customRow.appendChild(sendBtn);
      panel.appendChild(customRow);
    }

    const scroll = root.querySelector("#threadScroll");
    scroll.scrollTop = scroll.scrollHeight;
  },

  renderFeed(root){
    root.innerHTML = `
      <div class="topbar">
        <div class="title">动态广场</div>
        <button class="back" id="refreshFeedBtn" title="刷新动态">${this.feedBusy ? "…" : "↺"}</button>
      </div>
      <div class="scroll" id="feedScroll"></div>
      ${this.bottomTabsHtml("feed")}
    `;
    this.bindBottomTabs(root);
    root.querySelector("#refreshFeedBtn").onclick = () => this.refreshFeed();

    const scroll = root.querySelector("#feedScroll");

    // 发布框
    const composeWrap = document.createElement("div");
    composeWrap.style.cssText = "margin:14px 16px;background:var(--bubble);border:1px solid var(--line);border-radius:14px;padding:12px 14px;";
    const composeInput = document.createElement("textarea");
    composeInput.placeholder = "分享点什么…";
    composeInput.style.cssText = "width:100%;min-height:50px;border:none;background:none;color:var(--ink);font-family:inherit;font-size:13.5px;resize:vertical;";
    const composeRow = document.createElement("div");
    composeRow.style.cssText = "display:flex;justify-content:flex-end;margin-top:6px;";
    const composeBtn = document.createElement("button");
    composeBtn.textContent = "发布";
    composeBtn.style.cssText = "background:var(--accent);color:#241D2B;border:none;padding:7px 18px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;";
    composeBtn.onclick = () => {
      if (this.feedBusy) return;
      this.postAsPlayer(composeInput.value);
      composeInput.value = "";
    };
    composeRow.appendChild(composeBtn);
    composeWrap.appendChild(composeInput); composeWrap.appendChild(composeRow);
    scroll.appendChild(composeWrap);

    if (this.feed.length === 0) {
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = this.aiReady()
        ? "还没有动态，点右上角刷新试试，或者自己先发一条。"
        : "还没设置AI：回到通讯录，点右上角 ⚙ 填上你的 API Key，再回来点刷新。";
      scroll.appendChild(hint);
    }

    this.feed.forEach(post => {
      const card = document.createElement("div");
      card.style.cssText = "margin:0 16px 14px 16px;background:var(--bubble);border:1px solid var(--line);border-radius:14px;padding:14px;";

      const head = document.createElement("div");
      head.style.cssText = "display:flex;align-items:center;gap:10px;margin-bottom:8px;";
      const av = document.createElement("div");
      av.className = "avatar";
      av.style.cssText = `width:36px;height:36px;font-size:14px;background:hsl(${hashHue(post.authorName)},50%,50%);`;
      av.textContent = post.authorName.slice(0,1);
      const nameWrap = document.createElement("div");
      const nm = document.createElement("div");
      nm.style.cssText = "font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;color:" +
        (post.authorType === "passerby" ? "var(--muted)" : "var(--ink)") + ";";
      nm.textContent = post.authorName + (post.authorType === "player" ? "（我）" : "");
      if (post.authorType === "passerby") {
        const tag = document.createElement("span");
        tag.style.cssText = "font-size:9.5px;font-weight:400;border:1px solid var(--line);border-radius:6px;padding:1px 5px;color:var(--muted);";
        tag.textContent = "路人";
        nm.appendChild(tag);
      }
      const tm = document.createElement("div");
      tm.style.cssText = "font-size:11px;color:var(--muted);";
      tm.textContent = this.formatFeedTime(post.createdAt);
      nameWrap.appendChild(nm); nameWrap.appendChild(tm);
      head.appendChild(av); head.appendChild(nameWrap);
      card.appendChild(head);

      const body = document.createElement("div");
      body.style.cssText = "font-size:14px;line-height:1.7;color:var(--ink);margin-bottom:10px;white-space:pre-wrap;";
      body.textContent = post.text;
      card.appendChild(body);

      const actionRow = document.createElement("div");
      actionRow.style.cssText = "display:flex;gap:18px;margin-bottom:6px;";
      const likeBtn = document.createElement("button");
      likeBtn.style.cssText = "background:none;border:none;cursor:pointer;font-size:12.5px;color:" + (post.liked ? "var(--accent)" : "var(--muted)") + ";";
      likeBtn.textContent = (post.liked ? "♥ " : "♡ ") + "喜欢";
      likeBtn.onclick = () => this.toggleLike(post.id);
      actionRow.appendChild(likeBtn);
      card.appendChild(actionRow);

      if (post.comments && post.comments.length) {
        const cWrap = document.createElement("div");
        cWrap.style.cssText = "background:var(--bubble-narrative);border-radius:10px;padding:10px 12px;margin-top:6px;";
        post.comments.forEach(cm => {
          const line = document.createElement("div");
          const indent = cm.replyToName ? "16px" : "0px";
          line.style.cssText = "font-size:12.5px;line-height:1.7;color:var(--ink);margin-bottom:5px;margin-left:" + indent + ";";
          const nameColor = cm.authorType === "char" ? "var(--accent-soft)" : (cm.authorType === "player" ? "var(--ink)" : "var(--muted)");
          const strong = document.createElement("span");
          strong.style.cssText = "font-weight:700;color:" + nameColor + ";";
          strong.textContent = cm.authorName + (cm.authorType === "passerby" ? " " : "") + "：";
          if (cm.replyToName) {
            const replyTag = document.createElement("span");
            replyTag.style.cssText = "color:var(--muted);font-weight:400;font-size:11.5px;";
            replyTag.textContent = "回复@" + cm.replyToName + "：";
            line.appendChild(replyTag);
          }
          line.appendChild(strong);
          line.appendChild(document.createTextNode(cm.text));
          cWrap.appendChild(line);
        });
        card.appendChild(cWrap);
      }

      const commentRow = document.createElement("div");
      commentRow.className = "custom-input-row";
      commentRow.style.marginTop = "8px";
      const cInput = document.createElement("input");
      cInput.type = "text";
      cInput.placeholder = "写条评论…";
      const cSend = document.createElement("button");
      cSend.innerHTML = "➤";
      const submitComment = () => {
        this.addFeedComment(post.id, cInput.value);
        cInput.value = "";
      };
      cSend.onclick = submitComment;
      cInput.onkeydown = (e) => { if (e.key === "Enter") submitComment(); };
      commentRow.appendChild(cInput); commentRow.appendChild(cSend);
      card.appendChild(commentRow);

      scroll.appendChild(card);
    });
  },

  renderCall(root){
    const char = this.roster.find(c => c.id === this.activeCharId);
    if (!char) { this.goHome(); return; }

    if (this.callState === "incoming") {
      root.innerHTML = `
        <div class="call-screen">
          <div class="call-stars"></div>
          <div class="call-top">✧ incoming call ✧</div>
          <div class="call-avatar-wrap">
            <div class="call-avatar" style="background:hsl(${hashHue(char.name)},50%,45%);">${char.name.slice(0,1)}</div>
          </div>
          <div class="call-name">${char.name} 来电</div>
          <div class="call-preview" id="callPreviewText">${this.callPreviewLine ? this.callPreviewLine : "……"}</div>
          <div class="call-actions">
            <button class="call-action-btn decline" id="declineBtn">☎</button>
            <button class="call-action-btn accept" id="acceptBtn">☎</button>
          </div>
          <div class="call-action-labels">
            <span>拒绝</span><span>接听</span>
          </div>
        </div>
      `;
      root.querySelector("#declineBtn").onclick = () => this.declineCall();
      root.querySelector("#acceptBtn").onclick = () => this.acceptCall();
      return;
    }

    // active call
    root.innerHTML = `
      <div class="call-screen call-active">
        <div class="call-stars"></div>
        <button class="call-minimize" id="minimizeBtn">⌄</button>
        <div class="call-avatar-wrap small">
          <div class="call-avatar" style="background:hsl(${hashHue(char.name)},50%,45%);">${char.name.slice(0,1)}</div>
        </div>
        <div class="call-name">${char.name}</div>
        <div class="call-status">✧ speaking ✧</div>
        <div class="call-timer" id="callTimerDisplay">00:00</div>
        <div class="call-transcript" id="callTranscript"></div>
        <div class="call-input-row">
          <input type="text" id="callInput" placeholder="说点什么…">
          <button id="callSendBtn">➤</button>
        </div>
        <button class="call-hangup-btn" id="hangupBtn">☎</button>
      </div>
    `;
    const transcriptEl = root.querySelector("#callTranscript");
    this.callThread.forEach(t => {
      const line = document.createElement("div");
      line.className = t.speaker === "char" ? "call-line-char" : "call-line-player";
      line.textContent = (t.speaker === "char" ? "" : "你：") + t.text;
      transcriptEl.appendChild(line);
    });
    if (this.callBusy) {
      const typing = document.createElement("div");
      typing.className = "call-line-char";
      typing.textContent = "……";
      transcriptEl.appendChild(typing);
    }
    transcriptEl.scrollTop = transcriptEl.scrollHeight;

    const input = root.querySelector("#callInput");
    const submit = () => { this.sendCallLine(input.value); input.value = ""; };
    root.querySelector("#callSendBtn").onclick = submit;
    input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
    root.querySelector("#hangupBtn").onclick = () => this.hangupCall();
    root.querySelector("#minimizeBtn").onclick = () => { this.screen = "story"; this.render(); };

    this.startCallTimer();
  }
};

App.init();
</script>
</body>
</html>
